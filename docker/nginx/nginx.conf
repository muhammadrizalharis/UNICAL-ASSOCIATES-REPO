worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 25m;

    log_format json escape=json
        '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
        '"uri":"$uri","rt":$request_time,"ip":"$remote_addr"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream unical_web { server web:3000; }
    upstream unical_api { server api:8000; }

    server {
        listen 80;

        # Header keamanan; HSTS ditambahkan proxy kampus di lapis TLS.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # 'unsafe-inline' untuk style/script dibutuhkan Next.js (inline hydration).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location = /.well-known/security.txt {
            root /etc/nginx/static;
            default_type text/plain;
        }

        location = /security.txt { return 301 /.well-known/security.txt; }

        location /api/ {
            proxy_pass         http://unical_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /_next/static/ {
            proxy_pass     http://unical_web;
            proxy_set_header Host $host;
            expires        365d;
            add_header     Cache-Control "public, immutable";
        }

        # Halaman pengelola tidak boleh tersimpan di cache perantara.
        location ~ ^/(admin|dashboard|welcome/.+) {
            proxy_pass       http://unical_web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header       Cache-Control "private, no-store" always;
        }

        location / {
            proxy_pass       http://unical_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
